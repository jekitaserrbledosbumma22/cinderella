<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alat Timestamp</title>
<style>body{background:#111;color:#eee;font:14px system-ui;max-width:720px;margin:20px auto;padding:0 16px}
textarea{width:100%;height:200px;background:#000;color:#eee;border:1px solid #444;padding:8px;font:13px ui-monospace,monospace}
button{padding:8px 14px;margin:8px 0}#cur{font-size:22px;color:#ffd84a;min-height:60px}</style></head>
<body>
<h3>Alat timestamp (hanya untuk membuat lirik.js)</h3>
<p>1. Tempel lirik (satu baris per potongan). 2. Klik Mulai. 3. Tekan <b>Spasi</b> tepat saat tiap baris dinyanyikan. 4. Salin hasilnya ke <code>lirik.js</code>.</p>
<textarea id="in" placeholder="Tempel lirik di sini"></textarea><br>
<button id="go">Mulai</button> <span id="st"></span>
<div id="cur"></div>
<textarea id="res" readonly></textarea>
<audio id="a" src="lagu.mp3"></audio>
<script>
const $=i=>document.getElementById(i),a=$('a'),col=['kuning','putih','hijau'];
let q=null;
$('go').onclick=()=>{const t=$('in').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!t.length)return;
 q={t,i:0,o:[]};a.currentTime=0;a.play();$('res').value='';show();};
function show(){$('cur').textContent=q.t[q.i]||'';$('st').textContent=`baris ${q.i+1}/${q.t.length}`;}
addEventListener('keydown',e=>{if(!q||e.code!=='Space'||e.target.tagName==='TEXTAREA')return;e.preventDefault();
 q.o.push(`${a.currentTime.toFixed(2)}|${q.t[q.i]}|${col[q.i%3]}`);q.i++;
 $('res').value='const TIMELINE = `\n'+q.o.join('\n')+'\n`;';
 if(q.i>=q.t.length){q=null;a.pause();$('cur').textContent='Selesai. Salin kotak di bawah ke lirik.js';$('st').textContent='';}else show();});
</script></body></html>
